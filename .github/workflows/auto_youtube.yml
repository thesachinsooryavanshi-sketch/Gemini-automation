name: USA Finance 2D YouTube Automation

on:
  schedule:
    # Runs every Monday, Wednesday, Friday at 21:00 UTC (5:00 PM EST - USA Peak Time)
    # Agar roz chalana ho toh '0 21 * * 1,3,5' ko '0 21 * * *' kar dein
    - cron: '0 21 * * 1,3,5'
  workflow_dispatch: # Isse aap jab chahein 1-click mein manual test bhi kar sakte hain

jobs:
  build_and_upload_video:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -r requirements.txt

      - name: Run 2D Finance Video Generator & Uploader
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python main.py

      - name: Save Video Backup (Optional Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: generated-finance-video
          path: final_video.mp4
          retention-days: 3
